sentence=Saratech Soccer Robot Library for Open Weight League with TDaxis/GTD35 support
paragraph=Consolidated library for Open Weight league soccer robot. Preserves all TDaxis12 and GTD35 commands. Adds new classes: amirreza_class (TDAxis coefficient), sina_class (cm/s vector control + acceleration), sadra_class (go-to-point), king.forati_class (return to start), sina_rotation_class (manual gyro + servo). Wheel radius: 5cm. Only 4 components: spin back motor, GTD35, TDAxis, Servo.
